name: Compilar AutoLogin DLL

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Descargar archivos
        uses: actions/checkout@v4

      - name: Configurar MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Compilar DLL
        run: msbuild AutoLogin.sln /p:Configuration=Release /p:Platform=Win32

      - name: Subir DLL compilada
        uses: actions/upload-artifact@v4
        with:
          name: AutoLogin-DLL
          path: Release/*.dll
